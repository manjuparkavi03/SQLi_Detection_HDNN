<!DOCTYPE html>
<html>
<head>
    <title>AI SQLi Shield</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 100px; background-color: #eef2f3; }
        .container { background: white; padding: 40px; border-radius: 15px; display: inline-block; box-shadow: 0px 10px 20px rgba(0,0,0,0.1); border-top: 5px solid #007bff; }
        input[type="text"] { width: 350px; padding: 12px; margin: 20px 0; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        button { padding: 12px 30px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; }
        button:hover { background: #0056b3; }
        .result-box { margin-top: 30px; padding: 15px; border-radius: 8px; background: #f9f9f9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Smart SQLi Detector</h1>
        <p>Hybrid Deep Neural Network Security System</p>
        
        <form action="/predict" method="post">
            <input type="text" name="query" placeholder="Enter username or SQL query..." required autocomplete="off">
            <br>
            <button type="submit">Verify Input</button>
        </form>
        
        {% if prediction_text %}
            <div class="result-box">
                <h2 style="color: {{ color }};">{{ prediction_text }}</h2>
                <p>Analyzed String: <code>{{ query }}</code></p>
            </div>
        {% endif %}
    </div>
</body>
</html>
